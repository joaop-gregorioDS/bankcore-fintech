<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BankCore · Web Banking Corporativo</title>
  
  <link rel="icon" type="image/png" href="./assets/icon.png" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/views.css" />
</head>
<body>
  <div id="app">
    <!-- Desktop Topbar -->
    <header class="desktop-topbar">
      <div class="brand-container">
        <div class="brand-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="brand-title">
          <span class="bank">Bank</span><span class="core">Core</span>
        </div>
        <span class="app-version-badge">version 1.10.25</span>
      </div>

      <!-- Topbar Active User (Visible when logged in) -->
      <div id="topbarUser" class="hidden" style="display:flex; align-items:center; gap:10px;">
        <span class="user-name-mini" style="font-size:12px; font-weight:700; color:var(--text-secondary);"></span>
        <div class="user-avatar-mini" style="width:28px; height:28px; border-radius:50%; background:var(--accent-gold); color:#FFF; font-weight:900; font-size:11px; display:flex; align-items:center; justify-content:center;">
          LM
        </div>
      </div>
    </header>

    <!-- Main Viewport -->
    <main id="viewport" class="main-viewport"></main>

    <!-- Desktop Navigation Bar -->
    <nav id="desktopNav" class="desktop-nav hidden">
      <button class="nav-item active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Início</span>
      </button>

      <button class="nav-item" data-tab="pix">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
          <line x1="4" y1="22" x2="4" y2="15"/>
        </svg>
        <span>Pix</span>
      </button>

      <button class="nav-item" data-tab="statement">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <line x1="7" y1="8" x2="17" y2="8"/>
          <line x1="7" y1="12" x2="17" y2="12"/>
          <line x1="7" y1="16" x2="13" y2="16"/>
        </svg>
        <span>Extrato</span>
      </button>

      <button class="nav-item" data-tab="cards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
          <line x1="1" y1="10" x2="23" y2="10"/>
        </svg>
        <span>Cartões</span>
      </button>

      <button class="nav-item" data-tab="dda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
          <polyline points="17 6 23 6 23 12"/>
        </svg>
        <span>Serviços</span>
      </button>

      <button class="nav-item" data-tab="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Perfil</span>
      </button>
    </nav>

    <!-- Modal and Toast Containers -->
    <div id="modalContainer"></div>
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
