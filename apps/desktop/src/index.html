<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BankCore · Web Banking Corporativo</title>
  
  <link rel="icon" type="image/png" href="./assets/icon.png" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/views.css" />
</head>
<body>
  <div id="app">
    <!-- Desktop Left Sidebar -->
    <aside id="desktopSidebar" class="desktop-sidebar hidden">
      <!-- Sidebar Brand Header -->
      <div class="sidebar-header">
        <div class="brand-container">
          <div class="brand-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <div class="brand-title">
            <span class="bank">Bank</span><span class="core">Core</span>
          </div>
        </div>
        <div class="sidebar-badge-row">
          <span class="app-version-badge">version 1.10.25</span>
          <span class="badge-verified" style="font-size:8.5px;">PROD HTTPS</span>
        </div>
      </div>

      <!-- Navigation Menu -->
      <nav id="sidebarNav" class="sidebar-nav">
        <button class="nav-item active" data-tab="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Início</span>
        </button>

        <button class="nav-item" data-tab="pix">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
          <span>Área Pix</span>
        </button>

        <button class="nav-item" data-tab="statement">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="7" y1="8" x2="17" y2="8"/>
            <line x1="7" y1="12" x2="17" y2="12"/>
            <line x1="7" y1="16" x2="13" y2="16"/>
          </svg>
          <span>Extrato & Ledger</span>
        </button>

        <button class="nav-item" data-tab="cards">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
            <line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
          <span>Cartões Corporativos</span>
        </button>

        <button class="nav-item" data-tab="dda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
            <polyline points="17 6 23 6 23 12"/>
          </svg>
          <span>DDA & Boletos</span>
        </button>

        <button class="nav-item" data-tab="invest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v12M17 10l-5-5-5 5"/>
          </svg>
          <span>Investimentos</span>
        </button>

        <button class="nav-item" data-tab="credit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/>
            <path d="M12 18V6"/>
          </svg>
          <span>Crédito & Financiamento</span>
        </button>

        <button class="nav-item" data-tab="profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Perfil & Empresa</span>
        </button>
      </nav>

      <!-- Sidebar Footer (Active Account & Quick Logout) -->
      <div class="sidebar-footer">
        <div id="sidebarUserCard" class="sidebar-user-card" title="Visualizar perfil e empresa">
          <div class="sidebar-user-avatar" id="sidebarAvatar">LM</div>
          <div class="sidebar-user-info">
            <span class="sidebar-user-name" id="sidebarUserName">Lucas Mendes Rocha</span>
            <span class="sidebar-user-acc" id="sidebarUserAcc">Ag. 0001-9 · Cc. 77412-7</span>
          </div>
          <button id="btnQuickLogout" title="Sair da Conta (Logout)" style="color:var(--text-mute); padding:4px; border-radius:6px; transition:var(--transition); cursor:pointer;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main-content">
      <!-- Topbar inside Main Content -->
      <header id="contentTopbar" class="content-topbar hidden">
        <div class="topbar-page-title" id="pageTitleDisplay">
          <span>Início</span>
        </div>
        
        <div class="topbar-actions">
          <div style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-secondary); background:var(--bg-card); padding:4px 12px; border-radius:var(--radius-full); border:1px solid var(--border-subtle);">
            <span style="width:7px; height:7px; border-radius:50%; background:var(--color-credit); display:inline-block;"></span>
            <span>API Oficial HTTPS Conectada</span>
          </div>

          <!-- Quick Theme Toggle -->
          <button id="btnToggleThemeTopbar" class="btn-secondary" style="padding:6px 12px; font-size:12px; gap:6px;" title="Alternar Modo Claro / Escuro">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <span id="topbarThemeText">Tema</span>
          </button>
        </div>
      </header>

      <!-- Scrollable Viewport -->
      <main id="viewport" class="main-viewport"></main>
    </div>

    <!-- Modal and Toast Containers -->
    <div id="modalContainer"></div>
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
