name: BankCore CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Deliberately fail the disposable test gate"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bankcore-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-validation-only
      JWT_ACTIVE_KID: ci-validation
      AUTH_SERVICE_TOKEN: ci-service-token-validation
      RATE_LIMIT_KEY_SECRET: ci-rate-limit-key-validation
      TEST_VALIDATE_MIGRATIONS: "true"
      TEST_FORCE_FAILURE: ${{ inputs.force_failure || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax and focused lint
        run: |
          python -m compileall -q services infra scripts tests conftest.py
          python -m pip install --disable-pip-version-check --no-cache-dir ruff==0.6.9
          ruff check --select E9,F63,F7,F82 services infra scripts tests conftest.py

      - name: Python dependency audit
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pip-audit==2.7.3
          pip-audit -r services/auth-service/requirements.txt
          pip-audit -r services/transactions-service/requirements.txt
          pip-audit -r services/audit-service/requirements.txt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate production Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate disposable Compose files
        env:
          TEST_POSTGRES_PASSWORD: ci-validation-only
          RISK_TEST_POSTGRES_PASSWORD: ci-validation-only
          POSTGRES_PASSWORD: ci-validation-only
          JWT_ACTIVE_KID: ci-validation
          AUTH_SERVICE_TOKEN: ci-service-token-validation
          RATE_LIMIT_KEY_SECRET: ci-rate-limit-key-validation
        run: |
          docker compose -f docker-compose.test.yml config --quiet
          docker compose -f docker-compose.risk-test.yml config --quiet
          docker compose -f docker-compose.kafka-test.yml config --quiet
          docker compose -f docker-compose.outbox-test.yml config --quiet
          docker compose -f docker-compose.audit-test.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f docker-compose.p3-e2e.yml config --quiet

      - name: Build application images
        run: |
          docker compose -f docker-compose.yml build auth-service transactions-service risk-service
          docker compose -f docker-compose.yml pull nginx

      - name: Run disposable Python and Transactions gates
        run: bash scripts/test.sh all

  dotnet:
    name: .NET build, tests and EF validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET solution
        run: dotnet restore services/risk-service/BankCore.Risk.sln

      - name: Restore Risk PostgreSQL integration project
        run: dotnet restore services/risk-service/tests/BankCore.Risk.IntegrationTests/BankCore.Risk.IntegrationTests.csproj

      - name: NuGet dependency audit
        shell: bash
        run: |
          set -euo pipefail
          dotnet list services/risk-service/BankCore.Risk.sln package --vulnerable --include-transitive | tee "$RUNNER_TEMP/nuget-audit.txt"
          dotnet list services/risk-service/tests/BankCore.Risk.IntegrationTests/BankCore.Risk.IntegrationTests.csproj package --vulnerable --include-transitive | tee -a "$RUNNER_TEMP/nuget-audit.txt"
          if grep -Eq '(^|[[:space:]])(Critical|High|Moderate|Low)([[:space:]]|$)|CVE-|GHSA-' "$RUNNER_TEMP/nuget-audit.txt"; then
            echo "NuGet vulnerabilities detected."
            exit 1
          fi

      - name: Build .NET solution
        run: dotnet build services/risk-service/BankCore.Risk.sln --configuration Release --no-restore

      - name: Test .NET unit and API contracts
        run: dotnet test services/risk-service/BankCore.Risk.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=risk-tests.trx"

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.11

      - name: Validate EF migrations and model snapshot
        shell: bash
        env:
          RISK_DATABASE_CONNECTION: Host=localhost;Port=5432;Database=bankcore_test_risk;Username=bankadmin;Password=ci-validation-only
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations list \
            --project services/risk-service/src/BankCore.Risk.Infrastructure/BankCore.Risk.Infrastructure.csproj \
            --startup-project services/risk-service/src/BankCore.Risk.Migrator/BankCore.Risk.Migrator.csproj \
            --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes \
            --project services/risk-service/src/BankCore.Risk.Infrastructure/BankCore.Risk.Infrastructure.csproj \
            --startup-project services/risk-service/src/BankCore.Risk.Migrator/BankCore.Risk.Migrator.csproj \
            --configuration Release --no-build
          dotnet ef migrations script --idempotent \
            --project services/risk-service/src/BankCore.Risk.Infrastructure/BankCore.Risk.Infrastructure.csproj \
            --startup-project services/risk-service/src/BankCore.Risk.Migrator/BankCore.Risk.Migrator.csproj \
            --configuration Release --no-build --output "$RUNNER_TEMP/risk-migrations.sql"
          test -s "$RUNNER_TEMP/risk-migrations.sql"

  risk-integration:
    name: Risk PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run disposable Risk PostgreSQL integration
        shell: bash
        env:
          RISK_TEST_POSTGRES_PASSWORD: risk-ci-validation-only
        run: |
          set -euo pipefail
          project="bankcore-risk-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker compose -p "$project" -f docker-compose.risk-test.yml down -v --remove-orphans' EXIT
          docker compose -p "$project" -f docker-compose.risk-test.yml build
          docker compose -p "$project" -f docker-compose.risk-test.yml up -d --wait postgres-risk-test
          docker compose -p "$project" -f docker-compose.risk-test.yml run --rm migrate-risk-test
          docker compose -p "$project" -f docker-compose.risk-test.yml run --rm risk-integration-tests

  p2-e2e:
    name: Disposable Auth to Risk E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E key-generation dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir cryptography==50.0.1

      - name: Run disposable full-stack E2E
        run: python scripts/e2e.py

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install actionlint
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate workflows
        shell: bash
        run: actionlint

  kafka-smoke:
    name: Kafka KRaft smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Linux Kafka smoke test
        shell: bash
        run: bash scripts/kafka-test.sh

  outbox-publisher:
    name: Transactional outbox and publisher
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run outbox publisher tests
        shell: bash
        run: bash scripts/outbox-publisher-test.sh

  audit-consumer:
    name: Audit consumer idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run audit consumer tests
        shell: bash
        run: bash scripts/audit-consumer-test.sh

  kafka-retry-dlq:
    name: Kafka retry, DLQ and consumer groups
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run retry and DLQ tests
        shell: bash
        run: bash scripts/audit-retry-test.sh

  p3-e2e-failure-recovery:
    name: P3 E2E failure recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E key-generation dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir cryptography==50.0.1

      - name: Run P3 Linux E2E and failure recovery
        shell: bash
        run: bash scripts/p3-e2e.sh

  redis-resilience:
    name: Redis resilience and ownership boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install disposable runner dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir cryptography==50.0.1

      - name: Validate Redis policy and Transactions boundary
        run: python scripts/p4-architecture-gate.py

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pip-audit==2.7.3
          pip-audit -r services/auth-service/requirements.txt
          pip-audit -r services/transactions-service/requirements.txt
          pip-audit -r services/audit-service/requirements.txt

      - name: Run distributed rate-limit and fallback tests
        shell: bash
        run: bash scripts/p4-rate-limit.sh

      - name: Run Redis operational failure and recovery tests
        shell: bash
        run: bash scripts/p4-redis-hardening.sh

      - name: Run Transactions without Redis financial smoke test
        run: python scripts/p4d-transactions-no-redis.py
