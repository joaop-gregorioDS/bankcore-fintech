x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

x-container-hardening: &container-hardening
  <<: *no-new-privileges
  cap_drop:
    - ALL

services:
  postgres:
    <<: *no-new-privileges
    image: postgres:16.4-alpine3.20
    container_name: bankcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bankcore_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bankcore_net

  redis:
    <<: *no-new-privileges
    image: redis:7.4.1-alpine3.20
    container_name: bankcore-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - bankcore_net

  auth-service:
    <<: *container-hardening
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: bankcore-auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD}@postgres:5432/bankcore_auth
      REDIS_URL: redis://redis:6379/0
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_ISSUER: ${JWT_ISSUER:-bankcore-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bankcore-api}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?set JWT_ACTIVE_KID in .env}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_PUBLIC_KEYS_DIR: /run/secrets/jwt-public
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      INTERNAL_TOKEN_EXPIRE_SECONDS: ${INTERNAL_TOKEN_EXPIRE_SECONDS:-60}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?set AUTH_SERVICE_TOKEN in .env}
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - ${JWT_PRIVATE_KEY_FILE:-./secrets/jwt-private.pem}:/run/secrets/jwt-private.pem:ro
      - ${JWT_PUBLIC_KEYS_HOST_DIR:-./secrets/jwt-public}:/run/secrets/jwt-public:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/readiness', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bankcore_net

  transactions-service:
    <<: *container-hardening
    build:
      context: .
      dockerfile: services/transactions-service/Dockerfile
    container_name: bankcore-transactions-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD}@postgres:5432/bankcore_transactions
      REDIS_URL: redis://redis:6379/0
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_ISSUER: ${JWT_ISSUER:-bankcore-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bankcore-api}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?set JWT_ACTIVE_KID in .env}
      JWT_PUBLIC_KEYS_DIR: /run/secrets/jwt-public
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?set AUTH_SERVICE_TOKEN in .env}
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - ${JWT_PUBLIC_KEYS_HOST_DIR:-./secrets/jwt-public}:/run/secrets/jwt-public:ro
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readiness', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bankcore_net

  risk-service:
    <<: *container-hardening
    build:
      context: .
      dockerfile: services/risk-service/Dockerfile
    container_name: bankcore-risk-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${RISK_ASPNETCORE_ENVIRONMENT:-Production}
      RISK__SERVICE_NAME: ${RISK_SERVICE_NAME:-bankcore-risk}
      RISK__ENVIRONMENT_NAME: ${RISK_ENVIRONMENT_NAME:-Production}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/readiness > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - bankcore_net

  nginx:
    <<: *container-hardening
    image: nginxinc/nginx-unprivileged:1.27.1-alpine
    container_name: bankcore-nginx
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:8080"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infra/nginx/bankcore.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      transactions-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - bankcore_net

  migrate-auth:
    image: bankcore-fintech-audit-auth-service
    profiles: ["migration"]
    command: ["python", "/app/migrate.py", "--service", "auth"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD}@postgres:5432/bankcore_auth
      REDIS_URL: redis://redis:6379/0
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?set JWT_ACTIVE_KID in .env}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?set AUTH_SERVICE_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bankcore_net

  migrate-transactions:
    image: bankcore-fintech-audit-transactions-service
    profiles: ["migration"]
    command: ["python", "/app/migrate.py", "--service", "transactions"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD}@postgres:5432/bankcore_transactions
      REDIS_URL: redis://redis:6379/0
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?set JWT_ACTIVE_KID in .env}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?set AUTH_SERVICE_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bankcore_net

volumes:
  postgres_data:
  redis_data:

networks:
  bankcore_net:
    driver: bridge
