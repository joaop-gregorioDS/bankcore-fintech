services:
  postgres:
    image: postgres:16-alpine
    container_name: bankcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankcore_demo_change_me}
      POSTGRES_DB: bankcore_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bankcore_net

  redis:
    image: redis:7-alpine
    container_name: bankcore-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bankcore_net

  auth-service:
    build: ./services/auth-service
    container_name: bankcore-auth-service
    restart: unless-stopped
    volumes:
      - ./services/auth-service/app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD:-bankcore_demo_change_me}@postgres:5432/bankcore_auth
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-bankcore_demo_jwt_change_me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    depends_on:
      - postgres
      - redis
    networks:
      - bankcore_net

  transactions-service:
    build: ./services/transactions-service
    container_name: bankcore-transactions-service
    restart: unless-stopped
    volumes:
      - ./services/transactions-service/app:/app/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD:-bankcore_demo_change_me}@postgres:5432/bankcore_transactions
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-bankcore_demo_jwt_change_me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8000}
    depends_on:
      - postgres
      - redis
      - auth-service
    networks:
      - bankcore_net

  nginx:
    image: nginx:alpine
    container_name: bankcore-nginx
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infra/nginx/bankcore.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - transactions-service
    networks:
      - bankcore_net

volumes:
  postgres_data:
  redis_data:

networks:
  bankcore_net:
    driver: bridge
