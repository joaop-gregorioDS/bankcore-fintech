server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;

    location = /auth/docs { return 404; }
    location = /auth/redoc { return 404; }
    location = /auth/openapi.json { return 404; }
    location = /transactions/docs { return 404; }
    location = /transactions/redoc { return 404; }
    location = /transactions/openapi.json { return 404; }

    location /auth/ {
        proxy_pass http://auth-service:8000;
    }

    location /transactions/ {
        proxy_pass http://transactions-service:8001;
    }

    location /accounts {
        proxy_pass http://transactions-service:8001;
    }

    location /health {
        proxy_pass http://transactions-service:8001;
    }

    location / {
        try_files $uri /index.html;
    }
}
