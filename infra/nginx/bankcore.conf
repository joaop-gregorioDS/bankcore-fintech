map $http_x_request_id $bankcore_request_id {
    default $http_x_request_id;
    "" $request_id;
}

log_format bankcore_json escape=json
    '{"timestamp":"$time_iso8601","level":"INFO","service":"nginx",'
    '"environment":"production","event":"http.request.completed",'
    '"request_id":"$bankcore_request_id","status":$status,'
    '"duration_seconds":$request_time}';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log bankcore_json;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $bankcore_request_id;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;

    location = /auth/docs { return 404; }
    location = /auth/redoc { return 404; }
    location = /auth/openapi.json { return 404; }
    location = /auth/internal-token { return 404; }
    location ^~ /auth/internal/ { return 404; }
    location = /transactions/docs { return 404; }
    location = /transactions/redoc { return 404; }
    location = /transactions/openapi.json { return 404; }
    location = /risk { return 404; }
    location ^~ /risk/ { return 404; }
    location = /internal/risk/assessments { return 404; }
    location ^~ /internal/risk/ { return 404; }

    location /auth/ {
        proxy_pass http://auth-service:8000;
    }

    location /transactions/ {
        proxy_pass http://transactions-service:8001;
    }

    location /accounts {
        proxy_pass http://transactions-service:8001;
    }

    location /health {
        proxy_pass http://transactions-service:8001;
    }

    location / {
        try_files $uri /index.html;
    }
}
