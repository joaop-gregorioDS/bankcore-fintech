---
- name: Refuse to run the host role as a production deployment
  ansible.builtin.assert:
    that:
      - bankcore_environment in ['disposable', 'staging']
      - bankcore_docker_mode == 'rootless'
      - bankcore_current_release | length == 0
      - bankcore_previous_release | length == 0
    fail_msg: >-
      P6-F1 is a staging contract only. Use a separately reviewed deployment
      playbook for production and never pass release pointers to this role.
    quiet: true

- name: Validate the disposable inventory is local-only
  ansible.builtin.assert:
    that:
      - ansible_connection | default('') == 'local'
      - ansible_host | default('') in ['localhost', '127.0.0.1']
    fail_msg: >-
      The P6-F1 disposable target must use a local connection. A remote host
      requires a separately reviewed staging inventory and explicit approval.
    quiet: true

- name: Install optional host prerequisites
  ansible.builtin.package:
    name: "{{ bankcore_host_packages }}"
    state: present
  when: bankcore_install_host_packages | bool

- name: Ensure deploy group exists
  ansible.builtin.group:
    name: "{{ bankcore_deploy_group }}"
    state: present

- name: Ensure non-root deploy user exists
  ansible.builtin.user:
    name: "{{ bankcore_deploy_user }}"
    group: "{{ bankcore_deploy_group }}"
    home: "{{ bankcore_deploy_home }}"
    create_home: true
    shell: /bin/bash
    state: present

- name: Ensure host layout exists with explicit permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ bankcore_host_directories }}"

- name: Check Docker client for the deploy user when explicitly requested
  ansible.builtin.command: docker version --format '{{.Server.Version}}'
  become_user: "{{ bankcore_deploy_user }}"
  register: bankcore_docker_version
  changed_when: false
  environment:
    DOCKER_HOST: "unix:///run/user/{{ bankcore_deploy_user }}/docker.sock"
  when: bankcore_verify_docker_contract | bool

- name: Check Docker Compose plugin for the deploy user when explicitly requested
  ansible.builtin.command: docker compose version
  become_user: "{{ bankcore_deploy_user }}"
  register: bankcore_compose_version
  changed_when: false
  environment:
    DOCKER_HOST: "unix:///run/user/{{ bankcore_deploy_user }}/docker.sock"
  when: bankcore_verify_docker_contract | bool

- name: Enable user lingering only when explicitly requested
  ansible.builtin.command: loginctl enable-linger "{{ bankcore_deploy_user }}"
  changed_when: false
  when: bankcore_enable_rootless_linger | bool

- name: Report the host contract without exposing configuration values
  ansible.builtin.debug:
    msg:
      - "BankCore environment: {{ bankcore_environment }}"
      - "Deploy user: {{ bankcore_deploy_user }}"
      - "Docker mode: {{ bankcore_docker_mode }}"
      - "Release root: {{ bankcore_root }}/releases"
      - "Secrets directory mode: 0700"
      - "No firewall, DNS, TLS, registry or release pointer changes are performed by P6-F1"
