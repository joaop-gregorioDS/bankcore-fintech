x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

x-container-hardening: &container-hardening
  <<: *no-new-privileges
  cap_drop:
    - ALL

services:
  postgres:
    <<: *no-new-privileges
    image: postgres:16.4-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the production bundle}
      POSTGRES_DB: bankcore_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - bankcore_net

  audit-postgres:
    <<: *no-new-privileges
    image: postgres:16.4-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the production bundle}
      POSTGRES_DB: bankcore_audit
    volumes:
      - audit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - bankcore_net

  redis:
    <<: *no-new-privileges
    image: redis:7.4.1-alpine3.20
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--maxmemory", "${REDIS_MAXMEMORY:-64mb}"]
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - bankcore_net

  kafka:
    <<: *no-new-privileges
    image: apache/kafka:3.9.0
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - bankcore_net

  otel-collector:
    <<: *no-new-privileges
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "8889"
      - "13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - bankcore_net

  prometheus:
    <<: *no-new-privileges
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19095}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "promtool", "check", "config", "/etc/prometheus/prometheus.yml"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - bankcore_net

  grafana:
    <<: *no-new-privileges
    image: grafana/grafana:11.3.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13005}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD for the production bundle}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - bankcore_net

  migrate-auth:
    <<: *container-hardening
    image: "${BANKCORE_IMAGE_REGISTRY:-bankcore.local}/bankcore-auth:${BANKCORE_RELEASE_VERSION:?set BANKCORE_RELEASE_VERSION for the production bundle}"
    restart: "no"
    command: ["python", "/app/migrate.py", "--service", "auth"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD}@postgres:5432/bankcore_auth
      REDIS_URL: redis://redis:6379/0
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?set JWT_ACTIVE_KID for the production bundle}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?set AUTH_SERVICE_TOKEN for the production bundle}
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:?set RATE_LIMIT_KEY_SECRET for the production bundle}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bankcore_net

  migrate-transactions:
    <<: *container-hardening
    image: "${BANKCORE_IMAGE_REGISTRY:-bankcore.local}/bankcore-transactions:${BANKCORE_RELEASE_VERSION:?set BANKCORE_RELEASE_VERSION for the production bundle}"
    restart: "no"
    command: ["python", "/app/migrate.py", "--service", "transactions"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD}@postgres:5432/bankcore_transactions
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?set JWT_ACTIVE_KID for the production bundle}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?set AUTH_SERVICE_TOKEN for the production bundle}
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
    networks:
      - bankcore_net

  migrate-risk:
    <<: *container-hardening
    image: "${BANKCORE_IMAGE_REGISTRY:-bankcore.local}/bankcore-risk:${BANKCORE_RELEASE_VERSION:?set BANKCORE_RELEASE_VERSION for the production bundle}"
    restart: "no"
    entrypoint: ["dotnet"]
    command: ["/app/migrator/BankCore.Risk.Migrator.dll"]
    environment:
      RISK_DATABASE_CONNECTION: Host=postgres;Port=5432;Database=bankcore_risk;Username=${POSTGRES_USER:-bankadmin};Password=${POSTGRES_PASSWORD}
    depends_on:
      migrate-transactions:
        condition: service_completed_successfully
    networks:
      - bankcore_net

  migrate-audit:
    <<: *container-hardening
    image: "${BANKCORE_IMAGE_REGISTRY:-bankcore.local}/bankcore-audit:${BANKCORE_RELEASE_VERSION:?set BANKCORE_RELEASE_VERSION for the production bundle}"
    restart: "no"
    command: ["python", "/app/migrate_audit.py"]
    environment:
      AUDIT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD}@audit-postgres:5432/bankcore_audit
    depends_on:
      migrate-risk:
        condition: service_completed_successfully
      audit-postgres:
        condition: service_healthy
    networks:
      - bankcore_net

  kafka-init:
    <<: *no-new-privileges
    image: apache/kafka:3.9.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bankcore.transaction.completed.v1 --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bankcore.transaction.completed.v1.retry --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bankcore.transaction.completed.v1.dlq --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bankcore_net

  auth-service:
    <<: *container-hardening
    image: "${BANKCORE_IMAGE_REGISTRY:-bankcore.local}/bankcore-auth:${BANKCORE_RELEASE_VERSION:?set BANKCORE_RELEASE_VERSION for the production bundle}"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD}@postgres:5432/bankcore_auth
      REDIS_URL: redis://redis:6379/0
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_ISSUER: ${JWT_ISSUER:-bankcore-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bankcore-api}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?set JWT_ACTIVE_KID for the production bundle}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_PUBLIC_KEYS_DIR: /run/secrets/jwt-public
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      INTERNAL_TOKEN_EXPIRE_SECONDS: ${INTERNAL_TOKEN_EXPIRE_SECONDS:-60}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?set AUTH_SERVICE_TOKEN for the production bundle}
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:?set RATE_LIMIT_KEY_SECRET for the production bundle}
      RATE_LIMIT_MAX_ATTEMPTS: ${RATE_LIMIT_MAX_ATTEMPTS:-5}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-900}
      RATE_LIMIT_REDIS_TIMEOUT_SECONDS: ${RATE_LIMIT_REDIS_TIMEOUT_SECONDS:-1.0}
      DEMO_MODE: "false"
      OTEL_SERVICE_NAME: bankcore-auth
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_INSECURE: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_METRICS_INSECURE: "true"
    volumes:
      - ${JWT_PRIVATE_KEY_FILE:?set JWT_PRIVATE_KEY_FILE for the production bundle}:/run/secrets/jwt-private.pem:ro
      - ${JWT_PUBLIC_KEYS_HOST_DIR:?set JWT_PUBLIC_KEYS_HOST_DIR for the production bundle}:/run/secrets/jwt-public:ro
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/readiness', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - bankcore_net

  transactions-service:
    <<: *container-hardening
    image: "${BANKCORE_IMAGE_REGISTRY:-bankcore.local}/bankcore-transactions:${BANKCORE_RELEASE_VERSION:?set BANKCORE_RELEASE_VERSION for the production bundle}"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD}@postgres:5432/bankcore_transactions
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_ISSUER: ${JWT_ISSUER:-bankcore-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bankcore-api}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?set JWT_ACTIVE_KID for the production bundle}
      JWT_PUBLIC_KEYS_DIR: /run/secrets/jwt-public
      AUTH_SERVICE_URL: http://auth-service:8000
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?set AUTH_SERVICE_TOKEN for the production bundle}
      RISK_SERVICE_URL: http://risk-service:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: bankcore.transaction.completed.v1
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1.0}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OTEL_SERVICE_NAME: bankcore-transactions
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_INSECURE: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_METRICS_INSECURE: "true"
    volumes:
      - ${JWT_PUBLIC_KEYS_HOST_DIR:?set JWT_PUBLIC_KEYS_HOST_DIR for the production bundle}:/run/secrets/jwt-public:ro
    depends_on:
      migrate-transactions:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readiness', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - bankcore_net

  risk-service:
    <<: *container-hardening
    image: "${BANKCORE_IMAGE_REGISTRY:-bankcore.local}/bankcore-risk:${BANKCORE_RELEASE_VERSION:?set BANKCORE_RELEASE_VERSION for the production bundle}"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RISK__SERVICE_NAME: bankcore-risk
      RISK__ENVIRONMENT_NAME: Production
      RiskJwt__Issuer: ${JWT_ISSUER:-bankcore-auth}
      RiskJwt__Audience: bankcore-internal
      RiskJwt__PublicKeysDirectory: /run/secrets/jwt-public
      ConnectionStrings__RiskDatabase: Host=postgres;Port=5432;Database=bankcore_risk;Username=${POSTGRES_USER:-bankadmin};Password=${POSTGRES_PASSWORD}
      OTEL_SERVICE_NAME: bankcore-risk
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4317
    volumes:
      - ${JWT_PUBLIC_KEYS_HOST_DIR:?set JWT_PUBLIC_KEYS_HOST_DIR for the production bundle}:/run/secrets/jwt-public:ro
    expose:
      - "8080"
    depends_on:
      migrate-risk:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/readiness > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - bankcore_net

  outbox-publisher:
    <<: *container-hardening
    image: "${BANKCORE_IMAGE_REGISTRY:-bankcore.local}/bankcore-transactions:${BANKCORE_RELEASE_VERSION:?set BANKCORE_RELEASE_VERSION for the production bundle}"
    restart: unless-stopped
    command: ["python", "-m", "app.outbox_publisher"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD}@postgres:5432/bankcore_transactions
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:?set JWT_ACTIVE_KID for the production bundle}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?set AUTH_SERVICE_TOKEN for the production bundle}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: bankcore.transaction.completed.v1
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1.0}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-30}
      OUTBOX_PUBLISHER_ID: ${OUTBOX_PUBLISHER_ID:-production-publisher}
      OTEL_SERVICE_NAME: bankcore-outbox-publisher
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_INSECURE: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_METRICS_INSECURE: "true"
    depends_on:
      migrate-transactions:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks:
      - bankcore_net

  audit-consumer:
    <<: *container-hardening
    image: "${BANKCORE_IMAGE_REGISTRY:-bankcore.local}/bankcore-audit:${BANKCORE_RELEASE_VERSION:?set BANKCORE_RELEASE_VERSION for the production bundle}"
    restart: unless-stopped
    command: ["python", "-m", "audit_app.consumer"]
    environment:
      AUDIT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bankadmin}:${POSTGRES_PASSWORD}@audit-postgres:5432/bankcore_audit
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: bankcore.transaction.completed.v1
      KAFKA_RETRY_TOPIC: bankcore.transaction.completed.v1.retry
      KAFKA_DLQ_TOPIC: bankcore.transaction.completed.v1.dlq
      KAFKA_GROUP_ID: bankcore-audit-v1
      KAFKA_RETRY_GROUP_ID: bankcore-audit-retry-v1
      MAX_RETRIES: ${MAX_RETRIES:-3}
      LOCAL_RETRY_ATTEMPTS: ${LOCAL_RETRY_ATTEMPTS:-1}
      CONSUMER_VERSION: audit-consumer-v1
      OTEL_SERVICE_NAME: bankcore-audit-consumer
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_INSECURE: "true"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_METRICS_INSECURE: "true"
    depends_on:
      migrate-audit:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks:
      - bankcore_net

  nginx:
    <<: *container-hardening
    image: nginxinc/nginx-unprivileged:1.27.1-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_ADDRESS:-0.0.0.0}:${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infra/nginx/bankcore.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      transactions-service:
        condition: service_healthy
      risk-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - bankcore_net

volumes:
  postgres_data:
  audit_postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  bankcore_net:
    driver: bridge
