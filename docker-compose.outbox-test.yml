services:
  postgres-test:
    image: postgres:16.4-alpine3.20
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-bankadmin}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?set TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: bankcore_test_auth
    volumes:
      - outbox_test_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/test-init.sql:/docker-entrypoint-initdb.d/test-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - outbox_test_net

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - outbox_test_kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - outbox_test_net

  migrate-transactions-test:
    build:
      context: .
      dockerfile: services/transactions-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${TEST_POSTGRES_USER:-bankadmin}:${TEST_POSTGRES_PASSWORD}@postgres-test:5432/bankcore_test_transactions
      JWT_ACTIVE_KID: test-runner
      AUTH_SERVICE_TOKEN: test-runner
      BANKCORE_TESTING: "true"
    command: ["python", "/app/migrate.py", "--service", "transactions"]
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - outbox_test_net

  outbox-publisher:
    build:
      context: .
      dockerfile: services/transactions-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${TEST_POSTGRES_USER:-bankadmin}:${TEST_POSTGRES_PASSWORD}@postgres-test:5432/bankcore_test_transactions
      JWT_ACTIVE_KID: test-runner
      AUTH_SERVICE_TOKEN: test-runner
      BANKCORE_TESTING: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: bankcore.transaction.completed.v1
      OUTBOX_BATCH_SIZE: "100"
      OUTBOX_POLL_INTERVAL_SECONDS: "1"
      OUTBOX_LEASE_SECONDS: "30"
      OUTBOX_PUBLISHER_ID: outbox-publisher
    command: ["python", "-m", "app.outbox_publisher"]
    profiles: ["publisher"]
    depends_on:
      postgres-test:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate-transactions-test:
        condition: service_completed_successfully
    networks:
      - outbox_test_net

  publisher-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      BANKCORE_TESTING: "true"
      BANKCORE_TEST_DATABASE_URL: postgresql+asyncpg://${TEST_POSTGRES_USER:-bankadmin}:${TEST_POSTGRES_PASSWORD}@postgres-test:5432/bankcore_test_transactions
      DATABASE_URL: postgresql+asyncpg://${TEST_POSTGRES_USER:-bankadmin}:${TEST_POSTGRES_PASSWORD}@postgres-test:5432/bankcore_test_transactions
      JWT_ACTIVE_KID: test-runner
      AUTH_SERVICE_TOKEN: test-runner
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: bankcore.transaction.completed.v1
      OUTBOX_BATCH_SIZE: "10"
      OUTBOX_LEASE_SECONDS: "3"
      OUTBOX_PUBLISHER_ID: publisher-tests
    command: ["python", "-m", "pytest", "-q", "tests/p3d_outbox_publisher_tests.py"]
    depends_on:
      postgres-test:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate-transactions-test:
        condition: service_completed_successfully
    networks:
      - outbox_test_net

volumes:
  outbox_test_postgres_data:
  outbox_test_kafka_data:

networks:
  outbox_test_net:
    internal: true
